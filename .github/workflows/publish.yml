name: publish
# Publishes to PyPI with trusted publishing (OIDC): no token is stored anywhere.
# Runs when a GitHub Release is published, or by hand. The PyPI side must be set up once first (docs/pypi.md);
# until the repository variable PYPI_PUBLISH is "true" the job is skipped, so a fork or a fresh setup never shows a
# failed upload.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ${{ vars.CI_RUNNER }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/b" && "$RUNNER_TEMP/b/bin/pip" install -q build && "$RUNNER_TEMP/b/bin/python" -m build --outdir dist .
      - uses: pypa/gh-action-pypi-publish@release/v1
