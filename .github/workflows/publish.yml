name: publish
# Publishes to PyPI with trusted publishing (OIDC): no token is stored anywhere.
# Runs only when a GitHub Release is published. The PyPI side must be set up once first (docs/pypi.md).
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ${{ vars.CI_RUNNER }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/b" && "$RUNNER_TEMP/b/bin/pip" install -q build && "$RUNNER_TEMP/b/bin/python" -m build --outdir dist .
      - uses: pypa/gh-action-pypi-publish@release/v1
