[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prove-your-tests"
version = "0.1.0"
description = "Prove that your tests catch real bugs: planted bugs, red/green control, byte-identical restore."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuarterCharts" }]
keywords = ["testing", "mutation-testing", "test-quality", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quartercharts-com/prove-your-tests"
Issues = "https://github.com/quartercharts-com/prove-your-tests/issues"

[project.scripts]
prove-your-tests = "prove_your_tests.scripts.cli:main"

[tool.setuptools]
packages = ["prove_your_tests", "prove_your_tests.scripts"]

[tool.setuptools.package-dir]
prove_your_tests = "skill/prove-your-tests"
"prove_your_tests.scripts" = "skill/prove-your-tests/scripts"

[tool.setuptools.package-data]
prove_your_tests = ["SKILL.md", "config.default.json", "prompts/*.md", "references/*.md"]
